<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>지원장바구니 로고</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@500;800&display=swap">
<style>
  body { margin: 0; padding: 40px 24px; background: #E4E9F2; font-family: 'Gothic A1', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; color: #12306E; }
  main { max-width: 920px; margin: 0 auto; display: flex; flex-direction: column; gap: 40px; }
  h2 { margin: 0 0 12px; font-size: 16px; font-weight: 500; color: #3D4A63; }
  .scroll { overflow-x: auto; }
  .logo { width: 880px; height: 400px; display: flex; align-items: center; justify-content: center; gap: 36px; box-sizing: border-box; }
  .wordmark { font-size: 76px; font-weight: 800; letter-spacing: -2px; line-height: 1; }
  .tagline { font-size: 24px; font-weight: 500; letter-spacing: 0.5px; margin-top: 10px; }
  .light { background: #FFFFFF; }
  .dark { background: #12306E; color: #FFFFFF; }
  .symbol { width: 400px; height: 400px; background: #EEF2F8; display: flex; align-items: center; justify-content: center; }
  .icon { width: 280px; height: 280px; border-radius: 64px; background: #1E56C8; display: flex; align-items: center; justify-content: center; }
</style>
</head>
<body>
<main>

<section>
  <h2>기본 로고 (가로형)</h2>
  <div class="scroll">
    <div class="logo light">
      <svg width="168" height="168" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" aria-label="지원장바구니 심볼">
        <path d="M38 46 Q60 6 82 46" fill="none" stroke="#1E56C8" stroke-width="8" stroke-linecap="round"/>
        <g transform="rotate(-12 62 40)">
          <rect x="46" y="16" width="32" height="40" rx="6" fill="#D9690A"/>
          <path d="M53 36 L59 42 L71 29" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
        </g>
        <rect x="12" y="46" width="96" height="14" rx="7" fill="#1E56C8"/>
        <path d="M20 64 H100 L91 102 Q89 110 81 110 H39 Q31 110 29 102 Z" fill="#1E56C8"/>
        <path d="M46 74 V100 M60 74 V100 M74 74 V100" stroke="#FFFFFF" stroke-opacity="0.4" stroke-width="5" stroke-linecap="round"/>
      </svg>
      <div>
        <div class="wordmark"><span style="color:#D9690A">지원</span><span style="color:#1E56C8">장바구니</span></div>
        <div class="tagline" style="color:#3D4A63">청년정책 AI 에이전트</div>
      </div>
    </div>
  </div>
</section>

<section>
  <h2>심볼 · 앱 아이콘</h2>
  <div class="scroll">
    <div class="symbol">
      <div class="icon">
        <svg width="200" height="200" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" aria-label="지원장바구니 앱 아이콘">
          <path d="M38 46 Q60 6 82 46" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round"/>
          <g transform="rotate(-12 62 40)">
            <rect x="46" y="16" width="32" height="40" rx="6" fill="#F28B1E"/>
            <path d="M53 36 L59 42 L71 29" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
          </g>
          <rect x="12" y="46" width="96" height="14" rx="7" fill="#FFFFFF"/>
          <path d="M20 64 H100 L91 102 Q89 110 81 110 H39 Q31 110 29 102 Z" fill="#FFFFFF"/>
          <path d="M46 74 V100 M60 74 V100 M74 74 V100" stroke="#1E56C8" stroke-opacity="0.35" stroke-width="5" stroke-linecap="round"/>
        </svg>
      </div>
    </div>
  </div>
</section>

<section>
  <h2>반전 로고 (어두운 배경)</h2>
  <div class="scroll">
    <div class="logo dark">
      <svg width="168" height="168" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" aria-label="지원장바구니 심볼">
        <path d="M38 46 Q60 6 82 46" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round"/>
        <g transform="rotate(-12 62 40)">
          <rect x="46" y="16" width="32" height="40" rx="6" fill="#F6A04D"/>
          <path d="M53 36 L59 42 L71 29" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
        </g>
        <rect x="12" y="46" width="96" height="14" rx="7" fill="#FFFFFF"/>
        <path d="M20 64 H100 L91 102 Q89 110 81 110 H39 Q31 110 29 102 Z" fill="#FFFFFF"/>
        <path d="M46 74 V100 M60 74 V100 M74 74 V100" stroke="#12306E" stroke-opacity="0.3" stroke-width="5" stroke-linecap="round"/>
      </svg>
      <div>
        <div class="wordmark"><span style="color:#F6A04D">지원</span><span style="color:#FFFFFF">장바구니</span></div>
        <div class="tagline" style="color:#C9D4EA">청년정책 AI 에이전트</div>
      </div>
    </div>
  </div>
</section>

</main>
</body>
</html>

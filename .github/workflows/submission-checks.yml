name: Submission checks

on:
  push:
    branches: [main, feature/intake-api]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  windows-regression:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install repository and API dependencies
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install -r requirements.txt -r requirements-api.txt
      - name: Full Python regression including real HTTP routes
        run: .\.venv\Scripts\python.exe -m pytest -q
      - name: Client and synthetic demo scenarios
        run: node --test tests/test_demo_client.mjs tests/test_submission_demo.mjs
      - name: Compile and build static demo
        run: |
          .\.venv\Scripts\python.exe -m compileall -q api.py app.py src scripts tests
          .\.venv\Scripts\python.exe scripts/build_submission_demo.py --output "$env:RUNNER_TEMP/submission-demo"

name: Demo checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  windows-regression:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install repository and API dependencies
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install -r requirements.txt -r requirements-api.txt
      - name: Full Python regression including real HTTP routes
        run: .\.venv\Scripts\python.exe -m pytest -q
      - name: Client and synthetic demo scenarios
        run: node --test tests/test_demo_client.mjs tests/test_mock_demo.mjs
      - name: Compile and build static demo
        run: |
          .\.venv\Scripts\python.exe -m compileall -q api.py app.py src scripts tests
          .\.venv\Scripts\python.exe scripts/build_demo.py --output "$env:RUNNER_TEMP/demo-build"
      - name: Install isolated browser test dependency
        run: |
          npm install --no-save --package-lock=false @playwright/test
          npx playwright install chromium
      - name: Browser journeys and demo captures
        env:
          TEST_PYTHON: .venv/Scripts/python.exe
          TEST_DEMO_DIR: ${{ runner.temp }}/demo-build
        run: npx playwright test --config tests/demo_browser.config.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: demo-browser-captures
          path: browser-artifacts/
          if-no-files-found: ignore
          retention-days: 7
